
name: Deploy Markdown with Pandoc

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get repository license
        id: license
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LICENSE_NAME=$(gh api repos/${{ github.repository }} --jq '.license.name')
          LICENSE_HTML="https://github.com/${{ github.repository }}/blob/main/LICENSE"

          echo "name=$LICENSE_NAME" >> $GITHUB_OUTPUT
          echo "url=$LICENSE_HTML" >> $GITHUB_OUTPUT


      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build site
        run: |
          # ===== ESSAY =====
          LAST_DISPLAY_ESSAY=$(git log -1 --format=%cd --date=format:"%-d %B %Y" -- essay.md)
          LAST_ISO_ESSAY=$(git log -1 --format=%cd --date=format:"%Y-%m-%d" -- essay.md)
          FIRST_DISPLAY_ESSAY=$(git log --follow --reverse --format=%cd --date=format:"%Y" -- essay.md | head -n 1)
          FIRST_ISO_ESSAY=$(git log --follow --reverse --format=%cd --date=format:"%Y-%m-%d" -- essay.md | head -n 1)

          pandoc essay.md \
            --standalone \
            --template=assets/template/template.html \
            --citeproc \
            --csl=assets/csl/apa.csl \
            --toc \
            --metadata last_updated="$LAST_DISPLAY_ESSAY" \
            --metadata last_updated_iso="$LAST_ISO_ESSAY" \
            --metadata year_first_published="$FIRST_DISPLAY_ESSAY" \
            --metadata first_published_iso="$FIRST_ISO_ESSAY" \
            --metadata repo_url="https://github.com/${{ github.repository }}" \
            --metadata edit_url="https://github.com/${{ github.repository }}/blob/main/essay.md" \
            --metadata repo_name="${{ github.repository }}" \
            --metadata license_name="${{ steps.license.outputs.name }}" \
            --metadata license_url="${{ steps.license.outputs.url }}" \
            --metadata is_essay=true \
            --output=index.html

          # ===== DOCUMENTATION =====
          build_doc() {
            SRC="$1"
            OUT="$2"

            LAST_DISPLAY=$(git log -1 --format=%cd --date=format:"%-d %B %Y" -- "$SRC")
            LAST_ISO=$(git log -1 --format=%cd --date=format:"%Y-%m-%d" -- "$SRC")
            FIRST_DISPLAY=$(git log --follow --reverse --format=%cd --date=format:"%Y" -- "$SRC" | head -n 1)
            FIRST_ISO=$(git log --follow --reverse --format=%cd --date=format:"%Y-%m-%d" -- "$SRC" | head -n 1)

            pandoc "$SRC" \
              --standalone \
              --template=assets/template/template.html \
              --citeproc \
              --csl=assets/csl/apa.csl \
              --toc \
              --metadata root_path="../" \
              --metadata last_updated="$LAST_DISPLAY" \
              --metadata last_updated_iso="$LAST_ISO" \
              --metadata year_first_published="$FIRST_DISPLAY" \
              --metadata first_published_iso="$FIRST_ISO" \
              --metadata repo_url="https://github.com/${{ github.repository }}" \
              --metadata edit_url="https://github.com/${{ github.repository }}/blob/main/$SRC" \
              --metadata repo_name="${{ github.repository }}" \
              --metadata license_name="${{ steps.license.outputs.name }}" \
              --metadata license_url="${{ steps.license.outputs.url }}" \
              --metadata is_docs=true \
              --output="$OUT"
          }

          for f in docs/md/*.md; do
            name=$(basename "$f" .md)

            if [ "$name" = "howto" ]; then
              out="docs/index.html"
            else
              out="docs/$name.html"
            fi

            build_doc "$f" "$out"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
