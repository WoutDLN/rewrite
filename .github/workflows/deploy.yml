
name: Deploy Markdown with Pandoc

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get repository license
        id: license
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LICENSE_NAME=$(gh api repos/${{ github.repository }} --jq '.license.name')
          LICENSE_HTML="https://github.com/${{ github.repository }}/blob/main/LICENSE"

          echo "name=$LICENSE_NAME" >> $GITHUB_OUTPUT
          echo "url=$LICENSE_HTML" >> $GITHUB_OUTPUT


      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build site
        run: |
          make site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
